{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}تسجيل الدخول | DENTAL PRO{% endblock %}</title>
    
    <!-- Bootstrap 5 RTL CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="login-page">
    <div class="login-card shadow-lg fade-in">
        <div class="login-logo">🦷</div>
        <h2 class="text-cyan fw-bold">عيادتي</h2>
        <p class="subtitle">سجل دخولك لإدارة المواعيد</p>
        
        <form method="post" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label-custom">اسم المستخدم</label>
                <input 
                    type="text" 
                    name="username" 
                    class="form-control-custom" 
                    placeholder="أدخل اسم المستخدم"
                    required
                    autofocus
                >
            </div>
            
            <div class="mb-4">
                <label class="form-label-custom">كلمة المرور</label>
                <input 
                    type="password" 
                    name="password" 
                    class="form-control-custom" 
                    placeholder="أدخل كلمة المرور"
                    required
                >
            </div>
            
            <button type="submit" class="btn btn-cyan w-100 py-3 mb-3">
                <i class="bi bi-box-arrow-in-left me-2"></i>
                تسجيل الدخول
            </button>
        </form>
        
        {% if form.errors %}
        <div class="alert alert-danger mt-3 mb-0">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            اسم المستخدم أو كلمة المرور غير صحيحة
        </div>
        {% endif %}
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
